[project]
name = "robotparse"
version = "0.1.0"
description = "Convert KUKA KRL, FANUC TP (.ls) and ABB RAPID programs into time-sampled TCP trajectories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "lark>=1.1",
    "pyyaml>=6.0",
    "toppra>=0.6",
    "pin>=2.7",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
robotparse = "robotparse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]
